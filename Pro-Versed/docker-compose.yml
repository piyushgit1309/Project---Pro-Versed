version: '3.8'

services:
  proversed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proversed_platform
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PROVERSED_DB_PATH=/tmp/proversed.db
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
